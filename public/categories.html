<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Browse Categories — MCP Marketplace</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/styles.css">
    <script>
      (function(){const s=localStorage.getItem('mcp_theme')||(window.matchMedia('(prefers-color-scheme: light)').matches?'light':'dark');document.documentElement.setAttribute('data-theme',s);})();
    </script>
</head>
<body>
    <div id="navbar-container"></div>

    <main class="container" style="padding-top: 2rem; padding-bottom: 4rem;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2.5rem;">
            <div>
                <h1 style="margin-bottom: 0.25rem;">Browse Categories</h1>
                <p style="margin: 0; font-size: 0.9375rem;">Find MCP servers organized by integration type.</p>
            </div>
            <span id="cat-count" class="badge badge-cyan" style="font-size: 0.875rem; padding: 0.4rem 1rem;">Loading…</span>
        </div>

        <div id="categories-grid" class="grid grid-cols-4 gap-6">
            <!-- Category cards injected here -->
        </div>
    </main>

    <div id="footer-container"></div>

    <script src="/js/api.js"></script>
    <script src="/js/components.js"></script>
    <script src="/js/app.js"></script>
</body>
</html>
