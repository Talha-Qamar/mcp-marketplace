<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — MCP Marketplace</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/styles.css">
    <script>
      (function(){const s=localStorage.getItem('mcp_theme')||(window.matchMedia('(prefers-color-scheme: light)').matches?'light':'dark');document.documentElement.setAttribute('data-theme',s);})();
    </script>
</head>
<body style="display: flex; flex-direction: column; min-height: 100vh;">
    <div id="navbar-container"></div>

    <main style="flex: 1; display: flex; align-items: center; justify-content: center; padding: 3rem 1.5rem;">
        <div class="card auth-card">
            <!-- Logo mark -->
            <div class="auth-logo-mark">
                <div class="mark">
                    <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="8" x="2" y="2" rx="2"/><rect width="20" height="8" x="2" y="14" rx="2"/><line x1="6" x2="6.01" y1="6" y2="6"/><line x1="6" x2="6.01" y1="18" y2="18"/></svg>
                </div>
                <span>MCP<span style="color:var(--accent)">Market</span></span>
            </div>

            <h2 style="text-align: center; margin-bottom: 0.5rem; font-size: 1.375rem;">Welcome back</h2>
            <p style="text-align: center; margin-bottom: 1.75rem; font-size: 0.875rem;">Sign in to your developer account.</p>

            <!-- Social login (visual placeholder) -->
            <button class="social-btn" onclick="App.showToast('GitHub OAuth coming soon!','error'); return false;">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M12 0C5.374 0 0 5.373 0 12c0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23A11.509 11.509 0 0 1 12 5.803c1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576C20.566 21.797 24 17.3 24 12c0-6.627-5.373-12-12-12z"/></svg>
                Continue with GitHub
            </button>

            <div class="auth-divider">or sign in with email</div>

            <div id="login-error" style="color: var(--error); text-align: center; margin-bottom: 1rem; font-size: 0.875rem; min-height: 1.25rem;"></div>

            <form id="login-form" style="display:flex;flex-direction:column;gap:1rem;">
                <div class="form-field">
                    <label class="label" for="email">Email Address</label>
                    <input type="email" id="email" class="input" required placeholder="you@example.com" autocomplete="email">
                </div>
                <div class="form-field">
                    <label class="label" for="password">Password</label>
                    <input type="password" id="password" class="input" required placeholder="••••••••" autocomplete="current-password">
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem;">Log In</button>
            </form>

            <p style="text-align: center; margin-top: 1.5rem; font-size: 0.875rem; color: var(--text-2);">
                Don't have an account? <a href="/register.html" style="color: var(--accent); font-weight: 500;">Sign up free</a>
            </p>
        </div>
    </main>

    <div id="footer-container"></div>

    <script src="/js/api.js"></script>
    <script src="/js/components.js"></script>
    <script src="/js/app.js"></script>
</body>
</html>
