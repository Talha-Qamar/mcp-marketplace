<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile — MCP Marketplace</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/styles.css">
    <script>
      (function(){const s=localStorage.getItem('mcp_theme')||(window.matchMedia('(prefers-color-scheme: light)').matches?'light':'dark');document.documentElement.setAttribute('data-theme',s);})();
    </script>
</head>
<body>
    <div id="navbar-container"></div>

    <main class="container" style="padding-top: 2rem; padding-bottom: 4rem;">
        <div id="profile-header" class="card profile-header-card" style="margin-bottom: 2.5rem;">
            <!-- Profile header injected here -->
        </div>

        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.75rem;">
            <div>
                <h2 style="margin-bottom: 0.25rem;">Published Servers</h2>
                <p style="margin: 0; font-size: 0.875rem;">Servers you've shared with the MCP community.</p>
            </div>
            <a href="/publish.html" class="btn btn-primary btn-sm">
                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" x2="12" y1="5" y2="19"/><line x1="5" x2="19" y1="12" y2="12"/></svg>
                Publish New
            </a>
        </div>

        <div id="profile-servers" class="grid grid-cols-3 gap-6">
            <!-- User's servers injected here -->
        </div>

        <!-- MCP Secure shortcut -->
        <div style="margin-top:2.5rem;padding:1.25rem 1.5rem;border-radius:var(--r-lg);border:1px solid var(--border);background:var(--bg-card);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:1rem;">
            <div>
                <div style="font-weight:600;margin-bottom:0.2rem;">MCP Secure Dashboard</div>
                <p style="margin:0;font-size:0.875rem;color:var(--text-2);">View security verdicts, review queue, version watcher, and transparency log for your servers.</p>
            </div>
            <a href="/admin.html" class="btn btn-outline btn-sm">View Security Dashboard →</a>
        </div>
    </main>

    <div id="footer-container"></div>

    <script src="/js/api.js"></script>
    <script src="/js/components.js"></script>
    <script src="/js/app.js"></script>
</body>
</html>
